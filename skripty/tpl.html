<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KE.CY značenie – prehľad</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#667085;--bd:#e3e6eb;--ac:#2563eb;--ok:#15803d;--wr:#b45309;--wrbg:#fff7e6}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--tx:#e6e9ef;--mu:#98a2b3;--bd:#2c3340;--ac:#7aa2ff;--ok:#4ade80;--wr:#fbbf24;--wrbg:#2a2214}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--ac)}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
header h1{font-size:18px;margin:0 12px 0 0}
header input[type=search]{flex:1;min-width:180px;padding:6px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
button{font:inherit;padding:4px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);cursor:pointer}
button.on{outline:2px solid var(--ac)}
.zb.z1{border-color:#3cc954}.zb.z2{border-color:#f5c400}.zb.z3{border-color:#e8505b}.zb.z4{border-color:#3b8fd9}
.wrap{display:flex;gap:16px;max-width:1400px;margin:0 auto;padding:16px}
nav{position:sticky;top:70px;align-self:flex-start;width:240px;flex:none;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px}
nav ul{list-style:none;margin:0;padding:0}nav li{display:flex;gap:6px;align-items:center;padding:3px 0}
nav small{color:var(--mu);display:block;margin-top:8px}
main{flex:1;min-width:0}
section{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 18px;margin-bottom:16px}
section h2{margin:0 0 10px;font-size:20px}
h3{margin:18px 0 8px;font-size:16px}
.hint,.meta,small{color:var(--mu)}
.zt{display:inline-block;padding:0 7px;border-radius:9px;font-size:12px;font-weight:600;color:#111;margin-right:3px}
.zt.z1{background:#3cc954}.zt.z2{background:#f5c400}.zt.z3{background:#e8505b;color:#fff}.zt.z4{background:#3b8fd9;color:#fff}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.st{flex:1;min-width:130px;border:1px solid var(--bd);border-radius:8px;padding:10px}
.st b{font-size:26px;display:block}.st span{color:var(--mu);font-size:13px}.st.warn b{color:var(--wr)}
ul.done{list-style:none;padding:0}ul.done li{padding:2px 0;color:var(--ok)}ul.done li small a{font-size:12px}
ul.tasks{list-style:none;padding:0;margin:0}
.task{padding:6px 8px;border-bottom:1px solid var(--bd)}
.task.checked span{text-decoration:line-through;color:var(--mu)}
body.hideDone .task.checked{display:none}
.bar{display:flex;gap:12px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.trails{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
details.trail{border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
details summary{cursor:pointer}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid #0003}
.badge{background:var(--wrbg);color:var(--wr);font-size:12px;padding:0 6px;border-radius:8px;margin-left:6px}
.imgs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.imgs{align-items:flex-end}.sg{margin:0;text-align:center}.sg.tall img{height:150px}.sg img{height:56px;background:#fff;border:1px solid var(--bd);border-radius:4px}
.imgs.big .sg img{height:140px}
.sg figcaption{font-size:12px;color:var(--mu)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--bd);padding:4px 6px;text-align:left;vertical-align:top}
th{background:var(--bg)}
.tw{overflow-x:auto}
table.mini{width:auto}table.mini td{text-align:center}
.pts{font-size:13px;margin:6px 0}.pl{margin-right:4px}
ul.iss{margin:6px 0;padding-left:18px;color:var(--wr);font-size:14px}
.ok{color:var(--ok);font-size:14px;margin:6px 0}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.map{margin:0}.map img{width:100%;border:1px solid var(--bd);border-radius:6px;background:#fff}
.map figcaption{font-size:13px}
#gps tr.w td{background:var(--wrbg)}
#gps tr:target td{outline:2px solid var(--ac)}
details.doc{border-bottom:1px solid var(--bd);padding:6px 0}
.md{padding:6px 12px}.md li.i1{margin-left:20px}.md li.i2{margin-left:40px}
mark{background:#fde68a;color:#111;padding:0 2px}
ul.files{columns:2;font-size:14px}
.hidden,.zhide,.qhide{display:none!important}
#lb{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out}
#lb img{max-width:95vw;max-height:92vh;background:#fff;border-radius:6px}
@media (max-width:860px){.wrap{flex-direction:column;padding:16px}nav{position:static;width:auto}.trails{grid-template-columns:1fr}ul.files{columns:1}}
</style>
</head>
<body>
<header>
 <h1>KE.CY značenie</h1>
 {{ZBTN}}
 <input type="search" id="q" placeholder="Hľadať (trail, bod, text)…">
 <button id="openAll">rozbaliť všetko</button><button id="closeAll">zbaliť všetko</button>
</header>
<div class="wrap">
 <nav><b>Sekcie</b><ul>{{NAV}}</ul><small>Zaškrtávacím políčkom sekciu zobrazíš alebo skryješ. Filter zóny a vyhľadávanie platia pre celú stránku. Nastavenia a odškrtnuté úlohy si pamätá tento prehliadač.</small></nav>
 <main>{{BODY}}</main>
</div>
<div id="lb"><img alt=""></div>
<script>
const $=(s,r=document)=>[...r.querySelectorAll(s)];
const st=(()=>{try{return JSON.parse(localStorage.getItem('kecy-prehlad')||'{}')}catch(e){return{}}})();
st.done=st.done||{};st.hid=st.hid||{};
const save=()=>{try{localStorage.setItem('kecy-prehlad',JSON.stringify(st))}catch(e){}};
// sections
$('nav input[data-sec]').forEach(c=>{const s=document.getElementById(c.dataset.sec);
 if(st.hid[c.dataset.sec]){c.checked=false;s.classList.add('hidden')}
 c.onchange=()=>{s.classList.toggle('hidden',!c.checked);st.hid[c.dataset.sec]=!c.checked;save()}});
// tasks
function cntOpen(){document.getElementById('openN').textContent=$('.task').filter(t=>!t.classList.contains('checked')).length}
$('.task').forEach(t=>{const c=t.querySelector('input');c.checked=!!st.done[t.dataset.id];t.classList.toggle('checked',c.checked);
 c.onchange=()=>{st.done[t.dataset.id]=c.checked;t.classList.toggle('checked',c.checked);save();cntOpen()}});
cntOpen();
const hd=document.getElementById('hideDone');hd.checked=!!st.hideDone;document.body.classList.toggle('hideDone',hd.checked);
hd.onchange=()=>{st.hideDone=hd.checked;document.body.classList.toggle('hideDone',hd.checked);save()};
document.getElementById('resetT').onclick=()=>{if(confirm('Zrušiť všetky odškrtnutia?')){st.done={};save();$('.task').forEach(t=>{t.classList.remove('checked');t.querySelector('input').checked=false});cntOpen()}};
// zone filter
function zf(z){st.z=z;save();$('[data-zf]').forEach(b=>b.classList.toggle('on',b.dataset.zf===z));
 $('.f').forEach(e=>{const zs=(e.dataset.z||'all').split(' ');e.classList.toggle('zhide',z!=='all'&&!zs.includes(z)&&!zs.includes('all'))})}
$('[data-zf]').forEach(b=>b.onclick=()=>zf(b.dataset.zf));zf(st.z||'all');
// gps filters
const catF=document.getElementById('catF'),warnF=document.getElementById('warnF');
function gf(){$('#gps tbody tr').forEach(r=>r.classList.toggle('hidden',(catF.value&&r.dataset.cat!==catF.value)||(warnF.checked&&!r.classList.contains('w'))))}
catF.onchange=gf;warnF.onchange=gf;
// search
document.getElementById('q').oninput=e=>{const q=e.target.value.trim().toLowerCase();
 $('.task,#gps tbody tr,details.trail,details.doc,ul.files li').forEach(x=>x.classList.toggle('qhide',!!q&&!x.textContent.toLowerCase().includes(q)));
 if(q)$('details.doc,details.trail').forEach(d=>{if(!d.classList.contains('qhide'))d.open=true})};
// expand
document.getElementById('openAll').onclick=()=>$('details').forEach(d=>d.open=true);
document.getElementById('closeAll').onclick=()=>$('details').forEach(d=>d.open=false);
// jump to gps point: show section, clear filters
$('a[href^="#p"]').forEach(a=>a.addEventListener('click',()=>{const s=document.getElementById('gps');s.classList.remove('hidden');
 const c=document.querySelector('nav input[data-sec=gps]');c.checked=true;st.hid.gps=false;save();catF.value='';warnF.checked=false;gf();zf('all')}));
// lightbox
const lb=document.getElementById('lb');
$('a[data-img]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();lb.querySelector('img').src=a.dataset.img.replace('prehlad-img/','prehlad-img/');lb.style.display='flex'}));
lb.onclick=()=>lb.style.display='none';
document.addEventListener('keydown',e=>{if(e.key==='Escape')lb.style.display='none'});
</script>
</body>
</html>
